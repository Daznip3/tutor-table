<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Панель</title>
<style>body{margin:0;padding:48px 20px;text-align:center;font:15px -apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--tg-theme-hint-color,#8a9099);background:var(--tg-theme-bg-color,#fff)}</style>
</head><body>
<div id="m">Загружаю панель…</div>
<script>
// Переходник веб-панели бота репетитора. Бесплатный туннель (tuna) показывает в браузере страницу
// «Вы собираетесь посетить…» при каждом открытии. Здесь страница панели и её данные запрашиваются
// с пометкой «tuna-skip-browser-warning» — предупреждения нет. Данных здесь нет: только загрузка панели.
(async () => {
  const m = document.getElementById("m");
  const u = new URLSearchParams(location.search).get("u") || "";
  if (!/^https:\/\/[a-z0-9.-]+(\/[A-Za-z0-9_\/-]*)?$/i.test(u)) { m.textContent = "Откройте панель кнопкой в боте."; return; }
  const base = u.replace(/\/*$/, "/");
  try {
    const r = await fetch(base, {headers: {"tuna-skip-browser-warning": "1"}, cache: "no-store"});
    const html = await r.text();
    if (!r.ok || html.indexOf("telegram-web-app.js") < 0) throw new Error("not panel");
    document.open();
    document.write(html.replace(/<head>/i, '<head><base href="' + base + '">'));
    document.close();
  } catch (e) {
    const k = new URLSearchParams(location.search).get("k");     // ключ кнопки из меню бота
    location.replace(base + (k ? "?k=" + encodeURIComponent(k) : "") + location.hash);   // запасной путь: напрямую
  }
})();
</script>
</body></html>
