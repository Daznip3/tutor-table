<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2f7de1">
<title>Панель</title>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.tgLoaded && tgLoaded()"></script>
<style>
:root{
  color-scheme:light dark;
  --bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f2f3f5);
  --fg:var(--tg-theme-text-color,#17191c);--hint:var(--tg-theme-hint-color,#8a9099);
  --acc:var(--tg-theme-button-color,#2f7de1);--accfg:var(--tg-theme-button-text-color,#fff);
  --line:rgba(127,127,127,.22);
  --ok:#2e9b5f;--warn:#d9822b;--bad:#d64545;--soft:rgba(47,125,225,.13);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:var(--tg-theme-bg-color,#20242b);--bg2:var(--tg-theme-secondary-bg-color,#14171c);
    --fg:var(--tg-theme-text-color,#edf0f5);--hint:var(--tg-theme-hint-color,#a4adba);
    --acc:var(--tg-theme-button-color,#72adff);--accfg:var(--tg-theme-button-text-color,#101a28);
    --line:rgba(180,190,205,.22);--soft:rgba(114,173,255,.15);
    --ok:#64cd92;--warn:#f0b361;--bad:#ff8585;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2);color:var(--fg);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px 10px;background:var(--bg);
  border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--hint);font:inherit;font-size:14px;padding:8px 4px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--soft);color:var(--acc);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:12px 10px 40px}
.card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{color:var(--hint);font-size:13px}
.up{color:var(--ok)}.down{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-variant-numeric:tabular-nums;color:var(--hint);min-width:92px;font-size:14px}
.row .n{flex:1;min-width:0}
.row .n small{display:block;color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--hint)}
.tag.ok{background:rgba(46,155,95,.15);color:var(--ok)}
.tag.wait{background:rgba(217,130,43,.16);color:var(--warn)}
.tag.pend{background:var(--soft);color:var(--acc)}
.empty{color:var(--hint);padding:6px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input{flex:1;min-width:160px}
input[type=checkbox]{padding:0;margin:0;width:22px;height:22px;flex:0 0 22px;min-width:0;accent-color:var(--acc);border-radius:6px}
button:disabled{opacity:.4}
.tbl{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:9px 8px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{color:var(--hint);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-top:0;cursor:pointer;user-select:none}
th.s::after{content:" ↓"}th.s.asc::after{content:" ↑"}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg2)}
td.name{font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.debt{color:var(--bad);font-weight:600}
tr.more td{white-space:normal;background:var(--bg2);color:var(--fg);font-size:14px}
.week-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.week-head b{flex:1;text-align:center}
.week-head button,.btn{border:0;background:var(--bg);color:var(--acc);font:inherit;padding:8px 14px;border-radius:10px;cursor:pointer}
.days{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.days{grid-template-columns:repeat(7,1fr);gap:8px}.day .ev .tm{display:block}}
.day{background:var(--bg);border-radius:14px;padding:10px}
.day.today{box-shadow:inset 0 0 0 2px var(--acc)}
.day h3{margin:0 0 6px;font-size:14px}
.day h3 span{color:var(--hint);font-weight:400}
.ev{border-left:3px solid var(--acc);background:var(--bg2);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:14px}
.ev .tm{color:var(--hint);font-variant-numeric:tabular-nums;font-size:13px;margin-right:6px}
.ev.group{border-color:#8e6bd8}.ev.block{border-color:var(--hint);opacity:.7}
.ev.paid{border-color:var(--ok)}.ev.wait{border-color:var(--warn)}.ev.pending{border-left-style:dashed}
.ev.past{opacity:.6}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--hint);font-size:10.5px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--acc)}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{padding:30px 16px;text-align:center;color:var(--hint)}
.spin{padding:40px;text-align:center;color:var(--hint)}
.slist{display:none}@media(max-width:620px){.tbl{display:none}.slist{display:block}}
.two{display:grid;gap:12px}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.two .card{margin:0}
nav button{font-size:13.5px}
.click{cursor:pointer}.click:active{opacity:.6}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow-y:auto;background:var(--bg2);
  border-radius:16px 16px 0 0;padding:14px 12px 28px;transform:translateY(105%);transition:transform .22s ease;
  max-width:760px;margin:0 auto;-webkit-overflow-scrolling:touch}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 10px}
.sh-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sh-h b{font-size:18px;flex:1}
.x{border:0;background:var(--bg);color:var(--hint);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.act{border:0;border-radius:12px;padding:12px 8px;font:inherit;font-size:14.5px;background:var(--bg);color:var(--fg);cursor:pointer}
.act.pri{background:var(--acc);color:var(--accfg)}.act.ok{background:rgba(46,155,95,.16);color:var(--ok)}
.act.warn{background:rgba(217,130,43,.16);color:var(--warn)}.act.bad{background:rgba(214,69,69,.13);color:var(--bad)}
.act.wide{grid-column:1/-1}.act:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:0;border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;background:var(--bg);color:var(--hint);cursor:pointer}
.chip.on{background:var(--soft);color:var(--acc);font-weight:600}
.lk{display:inline-block;margin:4px 6px 0 0;padding:7px 12px;border-radius:10px;background:var(--bg2);color:var(--acc);
  text-decoration:none;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(20,20,22,.92);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.pre{white-space:pre-wrap}
.ans img{width:100%;border-radius:10px;margin-top:8px;display:block;background:var(--bg2);min-height:60px}
#imgv{position:fixed;inset:0;background:#000;z-index:40;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#imgv img{width:100%;display:block;touch-action:pinch-zoom}
#imgv .x{position:fixed;top:12px;right:12px;background:rgba(255,255,255,.2);color:#fff}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:80px;resize:vertical}
.ef{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ef:first-child{border-top:0}.ef span{color:var(--hint)}.ef b{font-weight:500;text-align:right}
.ev.free{border-left:3px dashed var(--ok);background:rgba(46,155,95,.07);color:var(--ok)}
.hwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hgrid{position:relative;display:grid;grid-template-columns:repeat(7,minmax(108px,1fr));gap:4px;padding-left:38px;min-width:800px}
.hcol .hh{height:30px;font-size:13px;font-weight:600;text-align:center;line-height:30px}
.hcol.today .hh{color:var(--acc)}
.hbody{position:relative;border-radius:8px;background:var(--bg2)}
.hb{position:absolute;left:2px;right:2px;margin:0;overflow:hidden;font-size:12.5px;padding:3px 5px;line-height:1.25}
.hb .tm{display:block;font-size:11.5px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hr span{position:absolute;left:0;top:-8px;font-size:11px;color:var(--hint);background:var(--bg);padding-right:4px}
.set label{display:block;margin:8px 0}.set label input:not([type=checkbox]),.set label select{width:100%;margin-top:4px}
.set label input[type=checkbox]{width:auto;margin-right:6px}.hint{color:var(--hint);font-size:13px;margin:4px 0}
.set details summary{cursor:pointer;padding:2px 0}
/* ---- меню, списки настроек, переключатели ---- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;border:0;background:var(--bg);border-radius:18px;padding:14px 14px 12px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-style:normal;font-size:21px;background:var(--soft)}
.tile b{display:block;margin-top:10px;font-size:15px}.tile small{display:block;color:var(--hint);font-size:12.5px;margin-top:2px;line-height:1.3}
.tile .cnt{position:absolute;top:12px;right:12px;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.banner{display:flex;gap:12px;align-items:center;background:rgba(214,69,69,.1);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.banner.ok{background:rgba(46,155,95,.1)}.banner .n{flex:1}.banner b{display:block}
.urg{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.urg:first-of-type{border-top:0}
.urg>span:first-child{flex:1}.urg .chev{flex:none;color:var(--hint)}.urg em{font-style:normal;font-weight:700;background:var(--bad);color:#fff;border-radius:10px;padding:1px 8px;font-size:12.5px}
.grp-t{font-size:12.5px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 6px}
.list{background:var(--bg);border-radius:16px;overflow:hidden;margin-bottom:10px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.li:first-child{border-top:0}.li.static{cursor:default}
.li .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--soft);font-size:16px;flex:none}
.li .t{flex:1;min-width:0}.li .t small{display:block;color:var(--hint);font-size:12.5px;line-height:1.3;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.li .v{color:var(--hint);font-size:14px;text-align:right;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .chev{color:var(--hint);font-size:20px;line-height:1;opacity:.6}
.li.sub{padding-left:30px;background:rgba(127,127,127,.04)}
.ed{padding:4px 14px 14px;border-top:1px dashed var(--line);background:rgba(127,127,127,.03)}
.ed .row2{display:flex;gap:8px;margin-top:8px}.ed .row2 input{flex:1;min-width:0}
.sw{position:relative;flex:none;width:46px;height:28px}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:14px;background:rgba(127,127,127,.35);transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{transform:translateX(18px)}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px;margin:6px 0}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13.5px;padding:7px 4px;border-radius:9px;color:var(--fg);cursor:pointer}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.okbtn{border:0;border-radius:10px;background:var(--acc);color:var(--accfg);font:inherit;padding:0 16px;cursor:pointer}
.rng{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--acc);border-radius:20px;padding:5px 6px 5px 12px;margin:3px 4px 3px 0;font-size:14px;font-weight:600}
.rng button{border:0;background:rgba(127,127,127,.15);color:var(--fg);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.ph{color:var(--hint);font-size:13px;margin:2px 4px 10px}
.wd{font-weight:600;width:34px;flex:none}

/* ===== ✨ оформление: анимации, герой, пульс, карта активности ===== */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:no-preference){
  #app>.card,#app>.kpis,#app>.two,#app>.hero,#app>.pulse,#app>.tiles,#app>.list,#app>.banner{animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
  #app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}
  #app>*:nth-child(5){animation-delay:.16s}#app>*:nth-child(n+6){animation-delay:.2s}
  .kpi,.tile,.card{transition:transform .15s,box-shadow .2s}
  @media(hover:hover){.kpi.click:hover,.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}}
}
.card,.kpi{box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(127,127,127,.08)}
nav{backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent)}
nav button{transition:background .2s,color .2s}
nav button .ni{display:block;font-size:18px;line-height:1.1}
@media(min-width:700px){nav button .ni{display:inline;margin-right:5px;font-size:15px}}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--bg) 25%,var(--bg2) 50%,var(--bg) 75%);background-size:200% 100%;
  animation:shimmer 1.2s linear infinite;margin-bottom:12px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;margin-bottom:12px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#8e6bd8 0%,transparent 55%),linear-gradient(135deg,var(--acc),#5b4bd6 70%,#7a3fc4)}
.hero:after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .hi{font-size:13px;opacity:.85}.hero h1{margin:2px 0 10px;font-size:23px;letter-spacing:-.01em}
.hero .hrow{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.hero .hn{flex:1;min-width:0}
.hero .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.hero .sub{font-size:13px;opacity:.85;margin-top:3px}
.hero .next{margin-top:12px;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;z-index:1}
.hero .next b{font-variant-numeric:tabular-nums}.hero .next .cd{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring{flex:none;width:92px;height:92px}.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:rgba(255,255,255,.22)}.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.3,1)}
.ring text{fill:#fff;font-size:17px;font-weight:700;text-anchor:middle}.ring .rs{font-size:9.5px;font-weight:500;opacity:.85}
.spark{display:block;width:100%;height:46px;margin-top:8px}
.pulse .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--bg2);border-radius:12px;padding:9px 11px}.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--hint)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:minmax(11px,17px);justify-content:space-between;gap:3px;overflow-x:auto;padding:3px 3px 4px}
.heat i{display:block;width:100%;aspect-ratio:1;border-radius:3.5px;background:rgba(127,127,127,.13)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,transparent)}.heat i.l2{background:color-mix(in srgb,var(--ok) 60%,transparent)}
.heat i.l3{background:color-mix(in srgb,var(--ok) 82%,transparent)}.heat i.l4{background:var(--ok)}
.heat i.td{outline:2px solid var(--acc);outline-offset:1px}.heat i.fut{opacity:.3}
.hleg{display:flex;flex-wrap:wrap;align-items:center;gap:4px;justify-content:flex-end;font-size:11.5px;color:var(--hint);margin-top:6px}
.hleg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.loadm{display:grid;grid-template-columns:24px repeat(var(--hc),1fr);gap:2px;font-size:10.5px;color:var(--hint);align-items:center}
.loadm i{display:block;height:16px;border-radius:3px;background:var(--acc)}
.ava{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13.5px;letter-spacing:.02em}
.lead{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.lead:first-of-type{border-top:0}
.lead .n{flex:1;min-width:0}.lead .n small{display:block;color:var(--hint);font-size:12.5px}
.lead .meter{height:5px;border-radius:3px;background:var(--bg2);margin-top:5px;overflow:hidden}.lead .meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),#8e6bd8)}
.medal{width:22px;text-align:center;font-size:16px;flex:none}
.badge-rec{display:inline-block;background:linear-gradient(90deg,#f6b73c,#f08a24);color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;animation:pop .5s both}
.tip{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.nowline{position:relative;height:0;border-top:2px solid var(--bad);margin:9px 0 9px 6px}
.nowline:before{content:"";position:absolute;left:-7px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.nowline span{position:absolute;right:0;top:-9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:8px;padding:1px 6px}
#sheet .pdays{grid-template-columns:1fr!important}

    document.querySelectorAll("[data-cat]").forEach(x => x.classList.toggle("on", x.dataset.cat === S.cat)); drawStudents(); });
  document.querySelectorAll("th").forEach(th => th.onclick = () => {

}
function drawStudents() {
  const q = S.q.trim().toLowerCase();
  let rows = S.items.filter(x => (!S.cat || x.cat === S.cat) &&
    (!S.f || (S.f === "next" ? x.next : S.f === "nonext" ? !x.next : S.f === "debt" ? x.debt : true)) &&
    (!q || [x.name, x.user, x.notes, x.goals, x.level].join(" ").toLowerCase().includes(q)));
  const k = S.sort, m = S.asc ? 1 : -1;
  rows.sort((a, b) => {
    let x = a[k], y = b[k];
    if (k === "next" || k === "last") { if (!x) return 1; if (!y) return -1; }
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "ru")) * m || a.name.localeCompare(b.name, "ru");
  });
  document.querySelectorAll("th").forEach(th => th.className = (th.className.replace(/\b(s|asc)\b/g, "").trim()
    + (th.dataset.k === k ? " s" + (S.asc ? " asc" : "") : "")).trim());
  const trow = x => `
    <tr data-id="${x.id}"><td class="name"><span style="display:inline-flex;align-items:center;gap:8px">${ava(x.name, 26)}${esc(x.name)}</span></td><td>${esc(x.cat) || "—"}</td><td class="num">${x.done}</td>
    <td>${dShort(x.last)}</td><td>${x.next ? dShort(x.next) + " " + hm(x.next) : "—"}</td>
    <td class="num">${x.month ? money(x.month) : "—"}</td><td class="num ${x.debt ? "debt" : ""}">${x.debt ? money(x.debt) : "—"}</td></tr>
`;
  const groupsT = S.cat || !S.cats.length ? [["", rows]] : [...S.cats, ""].map(c => [c || "Без направления", rows.filter(x => (x.cat || "") === c)]).filter(g => g[1].length);
  document.getElementById("tb").innerHTML = groupsT.map(([g, rs]) => (g ? `<tr><td colspan="7" style="background:var(--bg2);font-weight:600">${esc(g)} · ${rs.length}</td></tr>` : "")
    + rs.map(trow).join("")).join("") || `<tr><td colspan="7" class="empty">Никого не нашлось</td></tr>`;
  const srow = x => `<div class="row" data-id="${x.id}">${ava(x.name)}<div class="n">${esc(x.name)}
      <small>${[x.next ? "след. " + dShort(x.next) + " " + hm(x.next) : "", x.done + " зан."].filter(Boolean).map(esc).join(" · ")}</small>
</div>
      ${x.debt ? `<div class="v debt">${money(x.debt)}</div>` : ""}</div>`;
  const groupsS = S.cat ? [[S.cat, rows]] : [...S.cats, ""].map(c => [c || "Без направления", rows.filter(x => (x.cat || "") === c)]).filter(g => g[1].length);
  document.getElementById("sl").innerHTML = groupsS.map(([g, rs]) => `<h2 style="margin:12px 0 2px">${esc(g)} · ${rs.length}</h2>${rs.map(srow).join("")}`).join("")
    || `<div class="empty">Никого не нашлось</div>`;
  document.querySelectorAll("#sl .row, tbody tr[data-id]").forEach(tr => tr.onclick = () => openStudent(+tr.dataset.id));
  const debt = rows.reduce((s, x) => s + x.debt, 0), mon = rows.reduce((s, x) => s + x.month, 0);
  document.getElementById("sum").textContent =
    `${rows.length} ${plural(rows.length,"ученик","ученика","учеников")} · за месяц ${money(mon)}` + (debt ? ` · долги ${money(debt)}` : "");
}

let W = null;
function monday(d) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }

function evCls(x, now) {
  return `ev ${x.kind}${x.status === "pending" ? " pending" : ""}${x.paid === "y" ? " paid" : x.paid === "n" ? " wait" : ""}${x.end < now ? " past" : ""}`;
}
function dayEvents(d, ds) {
  return d.items.filter(x => x.start.slice(0, 10) === ds || (x.kind === "block" && x.start.slice(0, 10) <= ds && x.end.slice(0, 10) >= ds));
}
function listView(d) {
  const todayS = d.now.slice(0, 10); let html = "";
  for (let i = 0; i < 7; i++) {
    const day = new Date(W); day.setDate(day.getDate() + i); const ds = ymd(day);
    const ev = dayEvents(d, ds);
    const dl = ev.filter(x => x.kind === "lesson"), dsum = dl.reduce((a, x) => a + (x.price || 0), 0);
    let nowDone = ds !== todayS;

    html += `<div class="day${ds === todayS ? " today" : ""}"><h3>${WD[i]} <span>${day.getDate()} ${MON[day.getMonth()]}</span>${dl.length ? `<em class="dsum">${dl.length} · ${money(dsum)}</em>` : ""}</h3>
      ${dl.length ? `<div class="dload"><i style="width:${Math.min(100, dl.length / 6 * 100)}%"></i></div>` : ""}
      ${ev.length ? ev.map(x => nowLine(x) + `<div ${x.kind === "lesson" ? `data-lid="${x.id}" ` : x.kind === "free" ? `onclick="bookFree('${x.start}','${x.end}')" ` : ""}class="${x.kind === "lesson" || x.kind === "free" ? "click " : ""}${evCls(x, d.now)}">

function copyFree() {

// ---------- Деньги ----------
function chart(ms) {
  const W_ = Math.max(300, Math.min(1060, app.clientWidth - 48)), H = 210, P = 6, n = ms.length || 1, bw = (W_ - P * 2) / n;
  const mx = Math.max(1, ...ms.map(m => m.total + m.planned));
  const best = Math.max(...ms.map(m => m.total));
  let s = `<svg class="chart" viewBox="0 0 ${W_} ${H}" role="img" aria-label="Заработок по месяцам"><defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e6bd8"/><stop offset="1" stop-color="var(--acc)"/></linearGradient>
    <linearGradient id="cgb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b73c"/><stop offset="1" stop-color="#f08a24"/></linearGradient></defs>`;
  ms.forEach((m, i) => {
    const x = P + i * bw + bw * .15, w = bw * .7, h1 = (m.total / mx) * (H - 50), h2 = (m.planned / mx) * (H - 50);
    s += `<rect x="${x}" y="${H - 22 - h1}" width="${w}" height="${h1}" rx="5" class="gb" style="animation-delay:${i * 45}ms" fill="url(#${m.total === best && best ? "cgb" : "cg"})"><title>${m.label}: ${money(m.total)} (${m.cnt})</title></rect>`;
    if (h2) s += `<rect x="${x}" y="${H - 22 - h1 - h2}" width="${w}" height="${h2}" rx="4" fill="var(--acc)" opacity=".3"><title>запланировано ${money(m.planned)}</title></rect>`;
    s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${m.label}</text>`;
    if (m.total) s += `<text x="${x + w / 2}" y="${H - 28 - h1 - h2}" text-anchor="middle">${m.total === best ? "🏆 " : ""}${Math.round(m.total / 1000)}к</text>`;
  });
  return s + "</svg>";
}

function donut(obj) {
  const ent = Object.entries(obj).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  if (!ent.length) return `<div class="empty">Пока нет данных</div>`;
  const tot = ent.reduce((a, [, v]) => a + v, 0), R = 52, C = 2 * Math.PI * R; let off = 0;
  const arcs = ent.map(([k, v], i) => { const L = v / tot * C, a = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${PAL[i % PAL.length]}" stroke-width="20"
      stroke-dasharray="${Math.max(0, L - 1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(k)}: ${money(v)}</title></circle>`; off += L; return a; }).join("");
  return `<div class="donut"><svg viewBox="0 0 140 140" width="140" height="140">${arcs}<text x="70" y="67" text-anchor="middle" style="font-size:11px;fill:var(--hint)">всего</text>
    <text x="70" y="84" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--fg)">${Math.round(tot / 1000)}к</text></svg>
    <div class="dleg">${ent.map(([k, v], i) => `<div><i style="background:${PAL[i % PAL.length]}"></i><span>${esc(k)}</span><b>${Math.round(v / tot * 100)}%</b></div>`).join("")}</div></div>`;
}
function bars(obj) {
  const ent = Object.entries(obj); const mx = Math.max(1, ...ent.map(([, v]) => v));
  return ent.length ? `<div class="bars">${ent.sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    `<div class="bar"><span>${esc(k)}</span><i style="width:${Math.max(2, v / mx * 100)}%"></i><b>${money(v)}</b></div>`).join("")}</div>`
    : `<div class="empty">Пока нет данных</div>`;
}

let MANUAL = true;
async function post(what, body) {
  const r = await fetch(`api/${what}`, {method: "POST", cache: "no-store",
    headers: {...AUTH, "Content-Type": "application/json"},
    body: JSON.stringify(body)});
  let j = {}; try { j = await r.json(); } catch (_) {}
  if (r.status === 403) throw new Error("auth");
  if (r.status === 428 && j.need_pin && !body.pin) {          // 🔐 ПИН — тот же, что в боте; открывает на 15 минут
    const pin = await askPin();
    if (!pin) throw new Error("Отменено");
    return post(what, {...body, pin});
  }
  if (!r.ok) throw new Error(j.error && j.error.length > 6 ? j.error : "Не получилось — попробуйте ещё раз");
  return j;
}
function askPin() {
  return new Promise(res => {
    openSheet(`<div class="sh-h"><b>🔐 Введите ПИН</b></div><p class="hint">Это защищённое действие. ПИН тот же, что в боте — после ввода защищённые действия открыты 15 минут.</p>
      <div class="row2" style="display:flex;gap:8px"><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="flex:1;font-size:22px;letter-spacing:.3em;text-align:center">
      <button class="okbtn" id="pin-ok">OK</button></div>`, () => { closeSheetRaw(); res(""); });
    const inp = document.getElementById("pin-in"); inp.focus();
    const done = () => { const v = inp.value.trim(); closeSheetRaw(); res(v); };
    document.getElementById("pin-ok").onclick = done; inp.onkeydown = e => { if (e.key === "Enter") done(); };
  });
}

let CUR_SID = 0, PAST_REST = "";
function mockChart(ms, fc) {
  const pts = ms.filter(m => m.day); if (pts.length < 2) return "";
  const top = pts[0].kind === "ege_chem" ? 100 : Math.max(...pts.map(m => m.maxp || m.value), 1);
  const W_ = Math.max(280, Math.min(700, app.clientWidth - 60)), H = 170, P = 26;
  const xs = pts.map((_, i) => P + i * (W_ - P * 2) / Math.max(1, pts.length - 1));
  const y = v => H - 24 - (v / top) * (H - 44);
  let s = `<svg class="chart" viewBox="0 0 ${W_} ${H}" role="img" aria-label="Баллы пробников">`;
  [0.25, .5, .75, 1].forEach(f => s += `<line x1="${P}" x2="${W_ - P}" y1="${y(top * f)}" y2="${y(top * f)}" stroke="var(--line)"/>`);
  s += `<polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${pts.map((m, i) => xs[i] + "," + y(m.value)).join(" ")}"/>`;
  pts.forEach((m, i) => { s += `<circle cx="${xs[i]}" cy="${y(m.value)}" r="4" fill="var(--acc)"><title>${esc(m.title)} ${m.value}</title></circle>
    <text x="${xs[i]}" y="${y(m.value) - 9}" text-anchor="middle">${m.value}</text>`;
    if (pts.length <= 10 || i % 2 === 0) s += `<text x="${xs[i]}" y="${H - 6}" text-anchor="middle">${m.day.slice(8, 10)}.${m.day.slice(5, 7)}</text>`; });
  return s + "</svg>";
}

async function composeHomework(button) {
  const sids=[...document.querySelectorAll('[name="hw-sid"]:checked')].map(x=>+x.value), files=[...document.getElementById('hw-files').files];
  const text=document.getElementById('hw-text').value, bank=document.getElementById('hw-bank').checked;
  if ((!sids.length && !bank) || (!text.trim() && !files.length)) return toast('Добавьте задание и выберите получателей или банк');
  if (files.length>10 || files.some(f=>f.size>20*1024*1024)) return toast('До 10 файлов, каждый не больше 20 МБ');
  if (!await confirmAsk(`Выдать задание ${sids.length} ученикам${bank ? ' и сохранить в банк' : ''}?`)) return;
  button.disabled=true; button.textContent='Отправляю…';
  try {
    const msgs=[];
    for (const file of files) {
      const key=file.name+':'+file.size+':'+file.lastModified;
      if (!UPLOADS.has(key)) {
        const form=new FormData(); form.append('file',file);
        const r=await fetch('api/upload',{method:'POST',headers:AUTH,body:form});
        const j=await r.json(); if (!r.ok) throw new Error(j.error || 'Не удалось загрузить файл');
        UPLOADS.set(key,j.msg_id);
      }
      msgs.push(UPLOADS.get(key));
    }
    const j=await post('compose',{sids,text,msgs,bank,title:document.getElementById('hw-title').value,deadline:document.getElementById('hw-deadline').value,date:document.getElementById('hw-date').value});
    toast(j.note); SHEET_BACK=null; closeSheet(); await hwTab();
  } catch(ex) { toast(ex.message); button.disabled=false; button.textContent='📨 Выдать / сохранить'; }
}

let P = {}, TYPES = null, STUDS = null;
async function loadTypes() { if (!TYPES) { const d = await api("types"); TYPES = d.items; STUDS = d.students; } }
async function pickStart(o) {

}
function pickHead(title) {
  return `<div class="sh-h"><b>${title}</b><button class="x" onclick="SHEET_BACK=null;closeSheet()">✕</button></div>`;
}
async function pickDraw() {
  const title = P.replaces ? `↔️ Перенести · ${esc(P.name)}` : `➕ Записать${P.name ? " · " + esc(P.name) : ""}`;
  if (!P.sid) {
    const q = (P.q || "").toLowerCase();
    const list = STUDS.filter(s => !q || s.name.toLowerCase().includes(q));
    openSheet(pickHead("➕ Кого записать?") + `<div class="tools"><input id="pq" placeholder="🔎 Имя" value="${esc(P.q)}"></div>
      <div class="card">${list.map(s => `<div class="row click" data-pick="${s.id}"><div class="n">${esc(s.name)}<small>${esc(s.cat)}</small></div></div>`).join("")
        || `<div class="empty">Никого</div>`}</div>`);
    document.querySelectorAll("[data-pick]").forEach(r => r.onclick = () => {
      const s_ = STUDS.find(x => x.id === +r.dataset.pick); P.sid = s_.id; P.name = s_.name; pickDraw(); });
    const i = document.getElementById("pq"); i.oninput = e => { P.q = e.target.value; const pos = e.target.selectionStart; pickDraw();
      const n = document.getElementById("pq"); n.focus(); n.setSelectionRange(pos, pos); };
    return;
  }
  const fit = P.maxMin ? TYPES.filter(t => t.duration <= P.maxMin) : TYPES;
  if (!P.tid) {
    if (fit.length === 1) { P.tid = fit[0].id; P.dur = fit[0].duration; }
    else return openSheet(pickHead(title) + `<h2>Какое занятие?</h2><div class="acts">${fit.map(t =>
      `<button class="act wide" onclick="P.tid=${t.id};P.dur=${t.duration};pickDraw()">${esc(t.name)} · ${t.duration} мин</button>`).join("")
      || `<div class="empty">Ни один вид занятия не помещается в это окно</div>`}</div>`);
  }
  if (!P.day) P.day = P.fixedDay || ymd(new Date());
  const days = []; for (let i = 0; i < 21; i++) { const d = new Date(); d.setDate(d.getDate() + i); days.push(d); }
  let times = [];
  try { times = (await api("slots", `?date=${P.day}&dur=${P.dur}${P.replaces ? "&exclude=" + P.replaces : ""}`)).times; } catch (_) {}
  if (P.from) times = times.filter(t => t >= P.from && (!P.to || t < P.to));
  const tname = (TYPES.find(t => t.id === P.tid) || {}).name || "";
  openSheet(pickHead(title) + `<div class="empty" style="margin-top:-6px">${esc(tname)} · ${P.dur} мин</div>
    ${P.fixedDay ? "" : `<div class="hwrap"><div class="chips" style="flex-wrap:nowrap">${days.map(d =>
      `<button class="chip${ymd(d) === P.day ? " on" : ""}" style="white-space:nowrap" onclick="P.day='${ymd(d)}';pickDraw()">${WD[(d.getDay() + 6) % 7]} ${d.getDate()}</button>`).join("")}</div></div>`}
    <h2 style="margin-top:10px">Свободное время · ${dShort(P.day + "T00:00")}</h2>
    <div class="chips">${times.map(t => `<button class="chip" onclick="pickConfirm('${t}')">${t}</button>`).join("") || `<span class="empty">Свободных окон нет — выберите другой день или своё время</span>`}</div>
    <div class="tools" style="margin-top:12px"><input id="ptime" type="time" style="flex:0 0 130px;min-width:0">
      <button class="act" style="flex:1" onclick="const v=document.getElementById('ptime').value;v?pickConfirm(v):toast('Укажите время')">Своё время</button></div>`);
}
async function pickConfirm(t, force) {
  const start = P.day + "T" + t;
  if (!force && !(await confirmAsk(`${P.replaces ? "Перенести" : "Записать"} ${P.name} на ${dShort(start)} в ${t}? Ученику придёт сообщение.`))) return;
  try {
    const j = await post("book", {sid: P.sid, type: P.tid, start, replaces: P.replaces || 0, force: !!force});
    toast(j.note); LS[j.lesson.id] = j.lesson;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    SHEET_BACK = null; closeSheet(); refreshQuiet();
  } catch (ex) {
    if (/Пересекается/.test(ex.message) && await confirmAsk(ex.message + ". Всё равно записать?")) return pickConfirm(t, true);
    toast(ex.message);
  }
}
async function cancelLesson(id, whole) {
  if (!(await confirmAsk(whole ? "Отменить это и все следующие занятия серии? Ученику придёт сообщение." :
                                 "Отменить занятие? Ученику придёт сообщение."))) return;
  try { const j = await post("cancel", {id, whole}); toast(j.note.split("\n")[0]); SHEET_BACK = null; closeSheet(); refreshQuiet(); }
  catch (ex) { toast(ex.message); }
}
function bookFree(start, end) {
  const mins = Math.round((dt(end) - dt(start)) / 60000);
  pickStart({fixedDay: start.slice(0, 10), from: start.slice(11, 16), to: end.slice(11, 16), maxMin: mins});
}

function setSummary(sec) {

    case 'time': return `Шаг: ${n('step')} · перерыв ${n('buf_after')}`;
    case 'rules': return `Вперёд на ${n('horizon')} · отмена за ${n('cancel_hours')}`;
    case 'types': return SET.types.map(t => t.name).join(', ') || 'Нет ни одного';

    <label>Сообщение <textarea id="gm-text" rows="4" maxlength="3500"></textarea></label>

    <button class="act pri wide" onclick="sendGroupMsg(${gid},${gsid},this)">Отправить</button>`, () => groupSheet(gid));

async function uploadFiles(files) {
  if (files.length > 10 || files.some(f => f.size > 20 * 1024 * 1024)) throw new Error('До 10 файлов, каждый до 20 МБ');
  const msgs = [];
  for (const file of files) {
    const form = new FormData(); form.append('file', file);
    const r = await fetch('api/upload', {method: 'POST', headers: AUTH, body: form}), j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Не удалось загрузить файл');
    msgs.push(j.msg_id);
  }
  return msgs;
}
async function sendGroupMsg(gid, gsid, button) {
  const text = val('gm-text'), files = [...document.getElementById('gm-files').files];
  if (!text.trim() && !files.length) return toast('Добавьте текст или файл');
  button.disabled = true;
  try { const msgs = await uploadFiles(files);
    toast((await post('groups', gsid ? {action: 'session-msg', gsid, text, msgs} : {action: 'message', id: gid, text, msgs})).note); await groupSheet(gid); }
  catch (ex) { toast(ex.message); button.disabled = false; }
}

let OFFER = [];
async function offerSheet(sid, name) {
  const T = (await api('types')).items; OFFER = [];
  const today = ymd(new Date());
  openSheet(`<div class="sh-h"><b>📨 Предложить время · ${esc(name)}</b></div><div class="card set">
    <label>Вид занятия <select id="of-type">${T.map(t => `<option value="${t.id}" data-dur="${t.duration}">${esc(t.name)} · ${t.duration} мин</option>`).join('')}</select></label>
    <label>День <input type="date" id="of-day" value="${today}" min="${today}" onchange="offerTimes()"></label><div id="of-times"></div></div>
    <div id="of-list"></div><button class="act pri" style="width:100%" onclick="sendOffer(${sid},this)">📨 Отправить ученику</button>`, () => studentMore(sid));
  document.getElementById('of-type').onchange = offerTimes; offerTimes();
}
async function offerTimes() {
  const sel = document.getElementById('of-type'), dur = sel.selectedOptions[0] ? +sel.selectedOptions[0].dataset.dur : 60, day = val('of-day');
  const box = document.getElementById('of-times'); box.innerHTML = '<p class="hint">Ищу свободное время…</p>';
  try { const d = await api('slots', `?date=${day}&dur=${dur}`);
    box.innerHTML = d.times.length ? `<div class="chips">${d.times.map(t => `<button class="chip" onclick="addOffer('${day}T${t}')">${t}</button>`).join('')}</div>` : '<p class="hint">В этот день свободного времени нет</p>'; }
  catch (ex) { box.innerHTML = '<p class="hint">Не получилось загрузить время</p>'; }
}
function addOffer(when) {
  const sel = document.getElementById('of-type');
  if (OFFER.length >= 5) return toast('Не больше 5 вариантов');
  if (!OFFER.some(x => x[1] === when)) OFFER.push([+sel.value, when, sel.selectedOptions[0].textContent]);
  drawOffer();
}
function drawOffer() {
  document.getElementById('of-list').innerHTML = `<div class="list">${OFFER.map((x, i) => `<div class="li static"><div class="t">${esc(dm(x[1]))}<small>${esc(x[2])}</small></div><button class="x" onclick="OFFER.splice(${i},1);drawOffer()">✕</button></div>`).join('')}</div>`;
}
async function sendOffer(sid, button) {
  const times = OFFER.filter(x => x[1]).map(x => [x[0], x[1]]);
  if (!times.length) return toast('Выберите хотя бы одно время');
  button.disabled = true;
  try { toast((await post('card', {action: 'offer', sid, times})).note); studentMore(sid); }
  catch (ex) { toast(ex.message); button.disabled = false; }
}
async function cardPost(body, sid, button, ask) {
  if (ask && !await confirmAsk(ask)) return;
  if (button) button.disabled = true;
  try { toast((await post('card', body)).note); await studentMore(sid); }
  catch (ex) { toast(ex.message); if (button) button.disabled = false; }
}
async function vacPreview(sid, days) {
  let until = val('sv-until');
  if (days) { const x = new Date(); x.setDate(x.getDate() + days - 1); until = ymd(x); }
  if (!until) return toast('Выберите последний день отпуска');
  try { const j = await post('card', {action: 'vacation-preview', sid, until});
    document.getElementById('sv-prev').innerHTML = `<pre style="white-space:pre-wrap;font:inherit;font-size:13.5px">${esc(j.preview)}</pre>

  catch (ex) { toast(ex.message); }
}

    ${LIB_KIND === 'lec' ? `<div class="card"><div class="row2" style="display:flex;gap:8px"><input id="lib-sec" placeholder="Новый раздел, например «Физхимия»" style="flex:1;min-width:0"><button class="okbtn" onclick="libPost({action:'section-add',kind:'lec',name:val('lib-sec')})">＋</button></div></div>` : ''}`);
  sheet.scrollTop = y;

let LIB_VIEW = 'table';
function ptable(s) {   // раздел, где лекции названы «1. Водород…», — таблицей Менделеева
  const by = {}; s.items.forEach(x => { if (x.z) by[x.z] = x; });
  const cells = LIB.pt.map(([z, sym, r, c, cat]) => { const x = by[z], row = r;
    return `<button class="pt${x ? ' has' : ''}" style="grid-row:${row};grid-column:${c};${x ? `--c:${LIB.ptc[cat] || '#ccc'}` : ''}" ${x ? `onclick="libItem(${x.id})" title="${esc(x.title)}"` : 'disabled'}><i>${z}</i>${sym}</button>`; }).join('');
  const rest = s.items.filter(x => !x.z);
  return `<div class="ptwrap"><div class="ptgrid">${cells}<div class="ptgap" style="grid-row:8;grid-column:1/-1"></div></div></div>
    <p class="ph" style="margin:6px 14px">Цветные клетки — есть лекция (${Object.keys(by).length} из 118). Нажмите на элемент. <a href="#" onclick="LIB_VIEW='list';librarySheet(true);return false">Списком</a></p>
    ${rest.length ? libGroups({items: rest}).join('') : ''}`;
}
function libGroups(s) {
  const by = {};
  s.items.forEach(x => (by[x.topic] = by[x.topic] || []).push(x));
  return Object.entries(by).map(([t, xs]) => (t ? `<div class="li static sub"><div class="t"><b>${esc(t)}</b></div></div>` : '') +
    xs.map(x => `<div class="li${t ? ' sub' : ''}" onclick="libItem(${x.id})"><div class="t">${esc(x.title)}<small>${x.files} ф.${x.uses ? ' · отправляли ' + x.uses : ''}</small></div><span class="chev">›</span></div>`).join(''));
}

async function ideaPost(body, button, ask, after) {
  if (ask && !await confirmAsk(ask)) return;
  if (button) button.disabled = true;
  try { const j = await post('ideas', body); if (j.note) toast(j.note); await (after ? after() : ideasSheet()); }
  catch (ex) { toast(ex.message); if (button) button.disabled = false; }
}
async function ideaView(num) {
  openSheet('<div class="spin">Загружаю заявку…</div>', ideasSheet);
  try {
    const x = (await post('ideas', {action: 'view', num})).issue;
    openSheet(`<div class="sh-h"><b>${x.icon} Заявка №${x.num}</b><button class="x" onclick="SHEET_BACK=null;closeSheet()">✕</button></div>
      <p class="ph">${esc(x.label)}${x.closed ? ' · закрыта' : ''}</p>
      <div class="card"><pre style="white-space:pre-wrap;font:inherit;margin:0">${esc(x.body)}</pre></div>
      <div class="card">${x.progress.map(l => `<div>${esc(l)}</div>`).join('')}</div>
      ${x.comments.map(c => `<div class="card"><b>${c.who === 'Claude' ? '🤖 Claude' : '👤 Вы'}</b><pre style="white-space:pre-wrap;font:inherit;margin:6px 0 0">${esc(c.text)}</pre></div>`).join('')}
      ${x.closed ? '' : `${x.ready ? `<button class="act ok" style="width:100%;margin-bottom:8px" onclick="ideaPost({action:'release',num:${num},confirm:true},this,'Выпустить заявку №${num}? Бот обновится сам, когда в ближайший час нет занятий.')">✅ Выпустить</button>` : ''}
        <div class="card"><textarea id="idea-reply" rows="3" placeholder="Ответ или уточнение для Claude"></textarea>
        <div class="acts"><button class="act pri" onclick="ideaPost({action:'reply',num:${num},text:val('idea-reply')},this,null,()=>ideaView(${num}))">💬 Ответить</button>
        <button class="act" onclick="ideaPost({action:'codex',num:${num}},this,'Отдать заявку Codex прямо сейчас?',()=>ideaView(${num}))">⚡ Срочно — Codex</button></div>

function toggleProf(k) { const el = document.getElementById('prof-' + k); el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
async function stylePost(body, button) {
  if (button) button.disabled = true;
  try { const j = body.action === '_toggle' ? await post('settings', {action: 'toggle', key: 'style_on', value: body.value}) : await post('style', body);
    toast(j.note); await styleSheet(); }
  catch (ex) { toast(ex.message); if (button) button.disabled = false; }
}
async function uploadAvatar(button) {
  const file = document.getElementById('pv-photo').files[0];
  if (!file) return toast('Выберите фото');
  button.disabled = true;
  try { const form = new FormData(); form.append('file', file);
    const r = await fetch('api/upload', {method: 'POST', headers: AUTH, body: form}), j = await r.json();
    if (!r.ok || !j.file_id) throw new Error(j.error || 'Не удалось загрузить фото');
    await stylePost({action: 'avatar', file_id: j.file_id}, button); }
  catch (ex) { toast(ex.message); button.disabled = false; }
}

function peopleWeek(w, key) {   // как вкладка «Неделя»: дни карточками, занятия — время, без имён
  const m = new Date(w.mon + "T12:00:00"), e = new Date(m); e.setDate(e.getDate() + 6);
  const K = {l: ["Занятие", ""], g: ["Группа", "group"], x: ["Занят(а)", "block"]};
  const total = w.days.reduce((a, d) => a + d.items.filter(x => x.k !== "x").length, 0);
  return `<div class="week-head" style="margin-top:6px"><button onclick="peopleSheet('${esc(key)}',${w.off - 1})">‹</button>
      <b>${m.getDate()} ${MON[m.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]} · ${total} ${plural(total, "занятие", "занятия", "занятий")}</b>
      <button onclick="peopleSheet('${esc(key)}',${w.off + 1})">›</button></div>
    ${w.off ? `<div class="chips" style="justify-content:center"><button class="chip" onclick="peopleSheet('${esc(key)}',0)">Эта неделя</button></div>` : ""}

const TAB_ORDER = ["home", "students", "week", "hw", "money", "tools"];
// Переключения вкладок идут по очереди: пока рисуется одна, следующая ждёт (берётся только последняя).
// Иначе медленный ответ прежней вкладки мог дорисоваться поверх новой — экран «залипал».
let GO_BUSY = null, GO_NEXT = null, GO_SEQ = 0;
async function go(t) {
  const dir = Math.sign(TAB_ORDER.indexOf(t) - TAB_ORDER.indexOf(tab)) || 0;
  tab = t; requestAnimationFrame(movePill);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  if (GO_BUSY) { GO_NEXT = [t, dir]; return GO_BUSY; }
  GO_BUSY = (async () => {
    let job = [t, dir];
    while (job) { await goNow(job[0], job[1]); job = GO_NEXT; GO_NEXT = null; }
  })();
  try { await GO_BUSY; } finally { GO_BUSY = null; }
}
async function goNow(t, dir) {
  const seq = ++GO_SEQ;
  if (dir && !REDUCE.matches) app.animate([{opacity: .0, transform: `translateX(${dir * 22}px)`}, {opacity: 1, transform: "none"}], {duration: 320, easing: "cubic-bezier(.2,.7,.3,1)"});
  // Мгновенно: показать то, что было в прошлый раз (из памяти), и тихо обновить свежими данными
  let ok = true; STALE.clear(); USE_CACHE = true; app.innerHTML = skeleton();
  try { await TABS[t](); } catch (ex) { ok = false; USE_CACHE = false; if (STALE.size) { try { await TABS[t](); ok = true; } catch (e2) { fail(e2); } } else fail(ex); } finally { USE_CACHE = false; }
  if (ok && STALE.size) refreshQuiet(t, seq, new Map(STALE));      // не ждём — следующая вкладка не стоит в очереди
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
}
async function refreshQuiet(t, seq, old) {
  try {
    let changed = false;
    for (const [key, txt] of old) {

const _n = s => String(s || "").toLowerCase().replace(/ё/g, "е");

// ---------- 🎞 движение и жесты ----------
function haptic(k) { try { if (!tg || !tg.HapticFeedback) return; if (k === "success" || k === "error" || k === "warning") tg.HapticFeedback.notificationOccurred(k); else tg.HapticFeedback.impactOccurred(k); } catch (_) {} }

  el.appendChild(s); setTimeout(() => s.remove(), 600);

// свайп вниз закрывает окно
(function sheetSwipe() {

  let y0 = null, dy = 0, t0 = 0, last = 0, lastT = 0, v = 0;
  sheet.addEventListener("touchstart", e => { if (sheet.scrollTop > 2 && !e.target.closest(".grab,.sh-h")) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; v = 0; t0 = lastT = performance.now(); last = y0; }, {passive: true});
  sheet.addEventListener("touchmove", e => { if (y0 === null) return; const y = e.touches[0].clientY, now = performance.now();

// свайп влево/вправо — соседняя вкладка
(function tabSwipe() {
  // Направление решаем по первым ~14 px: «вбок» — двигаем вкладку и НЕ даём странице прокручиваться;

      || e.target.closest("nav,#sheet,#qs,.fabs,#story,#ptr,#newver")) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; lock = ""; }, {passive: true});

    app.style.transition = "none"; app.style.transform = `translateX(${dx * (edge ? .12 : .35)}px)`; app.style.opacity = String(1 - Math.min(.35, Math.abs(dx) / 900)); }, {passive: false});
  const end = () => { if (x0 === null && lock !== "x") return; const was = lock; x0 = null; lock = "";

// Версию подставляет сервер: прежняя личная ссылка получает новый интерфейс сама.
