<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Мой кабинет</title>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f2f3f5);
  --fg:var(--tg-theme-text-color,#17191c);--hint:var(--tg-theme-hint-color,#8a9099);
  --acc:var(--tg-theme-button-color,#2f7de1);--accfg:var(--tg-theme-button-text-color,#fff);
  --line:rgba(127,127,127,.2);--ok:#2e9b5f;--warn:#d9822b;--bad:#d64545;--soft:rgba(47,125,225,.13);
  --spring:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.2,.7,.3,1);
}
@media(prefers-color-scheme:dark){:root:not([data-tg]){--bg:#1c1f26;--bg2:#14171c;--fg:#e8eaee;--hint:#8f98a6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip;margin:0;background:var(--bg2);color:var(--fg);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
main{max-width:720px;margin:0 auto;padding:12px 12px 100px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes float{50%{transform:translateY(-6px) rotate(4deg)}}
@media(prefers-reduced-motion:no-preference){.in>*{animation:rise .45s var(--out) both}.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(4){animation-delay:.15s}.in>*:nth-child(n+5){animation-delay:.2s}}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px;color:#fff;margin-bottom:12px;
  background:radial-gradient(120% 140% at 100% 0%,#ff8fb1 0%,transparent 50%),radial-gradient(90% 90% at 0% 100%,#3ac0ff 0%,transparent 55%),linear-gradient(135deg,#5b4bd6,#7a3fc4)}
.hero .orb{position:absolute;right:-30px;top:-30px;font-size:120px;opacity:.18;animation:float 6s ease-in-out infinite}
.hero h1{margin:0 0 4px;font-size:24px;letter-spacing:-.01em}.hero .sub{opacity:.88;font-size:14px}
.next{margin-top:14px;background:rgba(255,255,255,.17);border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px)}
.next b{font-size:18px}.next .cd{float:right;font-weight:700;font-variant-numeric:tabular-nums}
.next .go{display:block;margin-top:10px;text-align:center;background:#fff;color:#4b3cc4;border-radius:12px;padding:10px;font-weight:700;text-decoration:none}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--bg);border-radius:16px;padding:10px 6px;text-align:center}.st b{display:block;font-size:21px;font-variant-numeric:tabular-nums}.st span{font-size:11.5px;color:var(--hint)}
.seg{position:sticky;top:0;z-index:5;display:flex;gap:4px;background:color-mix(in srgb,var(--bg2) 85%,transparent);backdrop-filter:blur(12px);padding:8px 0;margin-bottom:6px}
.seg button{flex:1;min-width:0;border:0;background:var(--bg);color:var(--hint);font:inherit;font-size:12.5px;padding:7px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:12px;cursor:pointer;transition:all .3s var(--spring)}
.seg button i{display:block;font-style:normal;font-size:18px;line-height:1.2}
.seg button.on{background:var(--acc);color:var(--accfg);font-weight:600;transform:translateY(-1px)}
.card{background:var(--bg);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:12.5px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .n{flex:1;min-width:0;overflow-wrap:anywhere}.row small{display:block;color:var(--hint);font-size:13px}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--bg2);color:var(--hint);white-space:nowrap}
.tag.ok{background:rgba(46,155,95,.15);color:var(--ok)}.tag.wait{background:rgba(217,130,43,.16);color:var(--warn)}.tag.new{background:var(--soft);color:var(--acc)}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--soft);font-size:18px;flex:none}
a.lk{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--bg2);color:var(--fg);text-decoration:none;margin-top:8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:600;background:var(--acc);color:var(--accfg);cursor:pointer;margin-top:8px}
.btn.soft{background:var(--soft);color:var(--acc)}
.empty{color:var(--hint);padding:8px 0}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--hint);font-size:10px}
.chart .ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s var(--out) .2s forwards}
.chart .pt{animation:pop .4s var(--out) both}
.dots{display:flex;flex-wrap:wrap;gap:5px}.dot{width:15px;height:15px;border-radius:50%;background:var(--ok);animation:pop .3s var(--out) both}
.dot.no{background:var(--bad)}.dot.wait{background:var(--warn)}
.skel{height:120px;border-radius:18px;margin-bottom:12px;background:linear-gradient(90deg,var(--bg) 25%,var(--bg2) 50%,var(--bg) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.err{text-align:center;color:var(--hint);padding:50px 20px}
.badge{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600}
.page{display:none}.page.on{display:block}
.mini{flex:none;border:0;border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;font-weight:600;background:var(--soft);color:var(--acc);cursor:pointer;transition:transform .15s}
.mini:active{transform:scale(.95)}.mini:disabled{opacity:.7}.mini.busy{opacity:.5}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,24px) scale(.96);opacity:0;background:rgba(20,20,22,.92);color:#fff;
  padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;display:flex;gap:8px;align-items:center;transition:opacity .25s,transform .45s var(--spring);pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}#toast path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .1s var(--out) forwards}
#ptr{position:fixed;left:50%;top:10px;z-index:6;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.15);display:grid;place-items:center;transform:translateY(-70px);opacity:0;transition:transform .3s var(--spring),opacity .2s}
@keyframes spin{to{transform:rotate(360deg)}}#ptr.spin span{animation:spin .8s linear infinite;display:inline-block}
#book{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
#book.on{background:rgba(0,0,0,.4);pointer-events:auto}
#book .bk{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:10px 14px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .5s var(--spring);max-width:720px;margin:0 auto;overscroll-behavior:contain}
#book.on .bk{transform:none}
#book .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.bkh{display:flex;align-items:center;margin-bottom:10px}.bkh b{flex:1;font-size:18px}
.x{border:0;background:var(--bg);color:var(--hint);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
.tps{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.tps button{flex:none;border:0;border-radius:14px;padding:9px 12px;background:var(--bg);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.tps button small{display:block;color:var(--hint);font-size:12px}.tps button.on{box-shadow:inset 0 0 0 2px var(--acc)}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.days::-webkit-scrollbar,.tps::-webkit-scrollbar{display:none}
.days button{flex:none;width:58px;border:0;border-radius:16px;padding:8px 0;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer;transition:transform .25s var(--spring)}
.days button b{display:block;font-size:20px}.days button small{display:block;font-size:11px;color:var(--hint)}
.days button.on{background:var(--acc);color:var(--accfg);transform:translateY(-2px)}.days button.on small{color:var(--accfg);opacity:.85}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.times button{position:relative;border:0;border-radius:12px;padding:12px 0;background:var(--bg);color:var(--fg);font:inherit;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;animation:pop .3s var(--out) both}
.times button i{position:absolute;top:2px;right:4px;font-style:normal;font-size:10px}.times button.on{background:var(--acc);color:var(--accfg)}
.hint2{color:var(--hint);font-size:12.5px;margin:10px 2px 0}
.kids{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:13.5px;color:var(--hint)}.kids span{margin-right:4px}
.kids button{border:0;border-radius:20px;padding:6px 12px;background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;cursor:pointer}.kids button.on{background:var(--acc);color:var(--accfg)}
.pv{background:linear-gradient(90deg,#f6b73c,#f08a24);color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:8px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.chart .ln{stroke-dashoffset:0}}
</style></head><body>
<main id="app"><div class="skel" style="height:200px"></div><div class="skel"></div><div class="skel"></div></main>
<script>
// Личный кабинет ученика. Данные — с сервера бота (адрес в ?u=…, или этот же сервер), вход — подписью Telegram.
const Q = new URLSearchParams(location.search), U = Q.get("u") || "";
const BASE = /^https:\/\/[a-z0-9.-]+(\/[A-Za-z0-9_\/-]*)?$/i.test(U) ? U.replace(/\/*$/, "/") : new URL(".", location.href).href;
const AS = /^\d+$/.test(Q.get("as") || "") ? Q.get("as") : "", PK = Q.get("k") || "";   // 👁 просмотр преподавателем
const INIT = (() => { try { return (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || ""; } catch (_) { return ""; } })();
let tg = null;
function tgInit() { const w = window.Telegram && Telegram.WebApp; if (!w || tg || AS) return; tg = w; document.documentElement.dataset.tg = "1";
  try { tg.ready(); tg.expand(); tg.setHeaderColor("secondary_bg_color"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (_) {} }
const s = document.createElement("script"); s.async = true; s.src = "https://telegram.org/js/telegram-web-app.js"; s.onload = tgInit; document.head.appendChild(s);
const app = document.getElementById("app");
const HDR = () => ({"X-Init-Data": INIT, "X-Panel-Key": PK, "tuna-skip-browser-warning": "1"});
let CHILD = /^\d+$/.test(Q.get("child") || "") ? Q.get("child") : "";
const QS = (extra) => { const p = new URLSearchParams(extra || ""); if (AS) p.set("as", AS); if (CHILD) p.set("child", CHILD); const t = p.toString(); return t ? "?" + t : ""; };
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const MON = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"], WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const dt = x => x ? new Date(x.replace(" ", "T") + ":00") : null;
const dLong = x => { const d = dt(x); return d ? `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}` : ""; };
const hm = x => x ? x.slice(11, 16) : "";
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const k = n % 10; return (n > 10 && n < 20) ? c : k === 1 ? a : (k >= 2 && k <= 4) ? b : c; };
let D = null, CUR = "₽", PAGE = "home", SKEW = 0;
const money = v => (Math.round(v) || 0).toLocaleString("ru-RU").replace(/[,\s]/g, " ") + " " + CUR;
const haptic = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || "light"); } catch (_) {} };
function until(x) { const ms = dt(x) - Date.now() - SKEW; if (ms <= 0) return "идёт сейчас"; const m = Math.round(ms / 60000);
  if (m < 60) return `через ${m} мин`; const h = Math.floor(m / 60); if (h < 24) return `через ${h} ч ${m % 60} мин`; const d = Math.round(h / 24); return `через ${d} ${plural(d, "день", "дня", "дней")}`; }
async function load() {
  const key = "me:" + BASE + AS + ":" + CHILD;
  try { const c = localStorage.getItem(key); if (c) { D = JSON.parse(c); render(); } } catch (_) {}
  try {
    const c = new AbortController(); setTimeout(() => c.abort(), 15000);
    const r = await fetch(BASE + "api/me" + QS(), {headers: HDR(), cache: "no-store", signal: c.signal});
    if (r.status === 403) throw new Error("auth");
    if (!r.ok) throw new Error("http");
    const txt = await r.text(); const fresh = JSON.parse(txt);
    try { localStorage.setItem(key, txt); } catch (_) {}
    const changed = !D || JSON.stringify(D) !== txt; D = fresh; if (changed) render();
  } catch (ex) {
    if (D) return;
    app.innerHTML = ex.message === "auth" ? `<div class="err">🔒 Откройте кабинет кнопкой в боте — «🎓 Личный кабинет».</div>`
      : `<div class="err">Не получилось загрузить кабинет. <br><br><button class="btn" style="max-width:240px;margin:auto" onclick="location.reload()">Ещё раз</button></div>`;
  }
}
function mockChart(ms) {
  if (ms.length < 2) return ms.length ? `<p>Последний пробник: <b>${ms[0].value}</b> · ${esc(ms[0].title || ms[0].day)}</p>` : "";
  const W = 320, H = 150, P = 18, mx = Math.max(100, ...ms.map(m => m.value)), st = (W - P * 2) / (ms.length - 1);
  const pts = ms.map((m, i) => [P + i * st, H - 24 - (m.value / mx) * (H - 44)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const best = Math.max(...ms.map(m => m.value)), first = ms[0].value, last = ms.at(-1).value;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a3fc4" stop-opacity=".35"/><stop offset="1" stop-color="#7a3fc4" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${pts.at(-1)[0]} ${H - 24} L${P} ${H - 24} Z" fill="url(#mg)"/>
    <path class="ln" d="${d}" fill="none" stroke="#7a3fc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle class="pt" style="animation-delay:${.3 + i * .08}s" cx="${p[0]}" cy="${p[1]}" r="${ms[i].value === best ? 6 : 4}" fill="${ms[i].value === best ? "#f08a24" : "#7a3fc4"}"/><text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle">${ms[i].value}</text>`).join("")}
    ${ms.map((m, i) => i % Math.ceil(ms.length / 6) === 0 ? `<text x="${pts[i][0]}" y="${H - 8}" text-anchor="middle">${esc((m.day || "").slice(5).split("-").reverse().join("."))}</text>` : "").join("")}</svg>
    <p style="margin:6px 0 0">${last >= first ? `📈 Рост: <b>+${last - first}</b> с первого пробника` : `Последний: <b>${last}</b>`} · лучший <b>${best}</b></p>`;
}
const HWS = {new: ["новое", "new"], returned: ["на доработку", "wait"], submitted: ["на проверке", "wait"], checked: ["проверено", "ok"]};
function render() {
  const d = D; CUR = d.cur || CUR; if (d.now) SKEW = dt(d.now) - Date.now();
  const nx = d.next[0], todo = d.hw.filter(h => h.status === "new" || h.status === "returned");
  const meet = nx && (nx.meet || (d.links.find(l => l.kind === "m") || {}).url);
  const pages = {
    home: `<div class="hero"><div class="orb">⚗️</div><div class="sub">${new Date().toLocaleDateString("ru-RU", {weekday: "long", day: "numeric", month: "long"})}</div>
        <h1>${d.parent ? esc(d.name) : `Привет, ${esc(d.name.split(" ")[0])}!`}</h1><div class="sub">${d.cat ? esc(d.cat) + " · " : ""}${d.done} ${plural(d.done, "занятие", "занятия", "занятий")} позади</div>
        ${d.vacation ? `<span class="badge">⏸ отпуск до ${esc(d.vacation.slice(8, 10) + "." + d.vacation.slice(5, 7))}</span> ` : ""}${d.streak >= 2 ? `<span class="badge">🔥 ${d.streak} ${plural(d.streak, "неделя", "недели", "недель")} подряд</span>` : ""}
        ${nx ? `<div class="next"><span class="cd" data-cd="${nx.start}">${until(nx.start)}</span><div>Следующее занятие</div><b>${dLong(nx.start)}, ${hm(nx.start)}</b><div style="opacity:.85;font-size:13px">${esc(nx.type)}${nx.pending ? " · ждёт подтверждения" : ""}</div>
          ${meet ? `<a class="go" href="${esc(meet)}" target="_blank" rel="noopener" onclick="return openLink(this.href)">🎥 Подключиться к занятию</a>` : ""}</div>`
          : `<div class="next"><b>Ближайших занятий нет</b><button class="go" style="width:100%;border:0;font:inherit;font-weight:700" onclick="${d.parent ? "toBot()" : "openBook()"}">📅 Записаться</button></div>`}</div>
      <div class="chips"><div class="st"><b>${d.done}</b><span>занятий</span></div><div class="st"><b>${todo.length}</b><span>заданий</span></div>
        <div class="st"><b>${d.mocks.length ? d.mocks.at(-1).value : "—"}</b><span>пробник</span></div>
        <div class="st"><b style="color:${d.balance < 0 ? "var(--bad)" : "inherit"}">${d.balance === null ? "—" : d.balance < 0 ? "−" + Math.abs(d.balance) : d.balance}</b><span>${d.balance === null ? "баланс" : d.balance < 0 ? "к оплате" : "аванс"}</span></div></div>
      ${d.next.length > 1 ? `<div class="card"><h2>Дальше по расписанию</h2>${d.next.slice(1).map(b => `<div class="row"><div class="ic">📅</div><div class="n"><b>${dLong(b.start)}, ${hm(b.start)}</b><small>${esc(b.type)}</small></div>${b.pending ? '<span class="tag wait">ждёт</span>' : ''}</div>`).join("")}</div>` : ""}
      ${d.links.length ? `<div class="card"><h2>Всё для урока</h2>${d.links.map(l => `<a class="lk" href="${esc(l.url)}" onclick="return openLink(this.href)"><span class="ic">${l.icon}</span><span>${esc(l.title)}</span></a>`).join("")}</div>` : ""}
      ${todo.length ? `<div class="card"><h2>Нужно сделать</h2>${todo.slice(0, 3).map(hwRow).join("")}<button class="btn soft" onclick="show('hw')">Все задания</button></div>` : ""}
      ${d.parent ? `<button class="btn" onclick="toBot()">📅 Записать или перенести — в боте</button>` : d.book && !d.book.block ? `<button class="btn" onclick="openBook()">📅 Записаться на занятие</button>` : ""}
      <button class="btn soft" onclick="toBot()">💬 Написать преподавателю</button>`,
    hw: `<div class="card"><h2>Задания · ${d.hw.length}</h2>${d.hw.length ? d.hw.map(hwRow).join("") : `<div class="empty">Заданий пока нет 🎉</div>`}
      <p style="color:var(--hint);font-size:13px">Сдать задание — фото или файлом в чате с ботом.</p><button class="btn" onclick="toBot()">📤 Сдать в боте</button></div>`,
    prog: `${d.mocks.length ? `<div class="card"><h2>Пробники</h2>${mockChart(d.mocks)}</div>` : ""}
      <div class="card"><h2>Последние занятия</h2>${d.past.length ? `<div class="dots">${d.past.slice().reverse().map((b, i) => `<i class="dot ${b.att === "noshow" ? "no" : b.paid === "n" ? "wait" : ""}" style="animation-delay:${i * 25}ms" title="${dLong(b.start)}"></i>`).join("")}</div>
        <p style="color:var(--hint);font-size:13px;margin-bottom:0">🟢 было · 🟠 ждёт оплаты · 🔴 пропуск</p>` : `<div class="empty">Пока нет проведённых занятий</div>`}</div>
      ${d.pays.length || d.balance !== null ? `<div class="card"><h2>Оплаты</h2>${d.balance !== null ? `<p style="margin-top:0">${d.balance < 0 ? `💳 К оплате: <b>${money(-d.balance)}</b>` : d.balance > 0 ? `💰 Оплачено вперёд: <b>${money(d.balance)}</b>` : "Долгов нет ✅"}</p>` : ""}

      : `<div class="empty">Преподаватель пока ничего не открыл</div>`}<p style="color:var(--hint);font-size:13px">«📩 Прислать» — файлы придут вам в чат с ботом.</p></div>`

  app.innerHTML = (PAR ? `<div class="kids"><span>👨‍👩‍👧 Кабинет ребёнка</span>${PAR.children.length > 1 ? PAR.children.map(k => `<button class="${k.id === PAR.cur ? "on" : ""}" onclick="CHILD='${k.id}';D=null;load()">${esc(k.name.split(" ")[0])}</button>`).join("") : `<b>${esc(PAR.children[0].name)}</b>`}</div>` : "")

async function act(body, btn) {

    const r = await fetch(BASE + "api/me" + QS(), {method: "POST", headers: {...HDR(), "Content-Type": "application/json"}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Не получилось");
    toast(j.note || "Готово", true); try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
    if (btn && body.action === "lib") btn.textContent = "✓ В чате";

let toastT = 0;

  el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2600); }

// ---------- 📅 запись: выбор времени прямо здесь, подтверждение — одной кнопкой в чате ----------
let BK = {tid: 0, days: [], di: 0};
function bookSheet(html) {
  let el = document.getElementById("book"); if (!el) { el = document.createElement("div"); el.id = "book"; document.body.appendChild(el);
    el.onclick = e => { if (e.target === el) closeBook(); }; }
  el.innerHTML = `<div class="bk"><div class="grab"></div><div class="bkh"><b>📅 Запись на занятие</b><button class="x" onclick="closeBook()">✕</button></div>${html}</div>`;
  el.classList.add("on"); document.documentElement.style.overflow = "hidden";
}
function closeBook() { const el = document.getElementById("book"); if (el) el.classList.remove("on"); document.documentElement.style.overflow = ""; }
async function openBook(tid) {
  const b = D.book || {types: []};

  if (!b.types.length) { toast("Сейчас запись недоступна — напишите преподавателю"); return; }

    const r = await fetch(BASE + "api/me" + QS("slots=" + BK.tid), {headers: HDR(), cache: "no-store", signal: c.signal});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || "Не получилось загрузить время");
    BK.days = j.days; BK.di = 0; drawBook();
  } catch (ex) { bookSheet(`<p class="empty">${esc(ex.message === "The user aborted a request." ? "Сервер долго отвечает — попробуйте ещё раз" : ex.message)}</p>`); }
}
function drawBook() {

  if (!BK.days.length) return bookSheet(types + `<p class="empty">Свободного времени пока нет — напишите преподавателю, он подберёт.</p>`);
  bookSheet(types + `<div class="days">${BK.days.map((x, i) => { const d = dt(x.day + " 12:00");
      return `<button class="${i === BK.di ? "on" : ""}" onclick="BK.di=${i};drawBook()"><small>${WD[d.getDay()]}</small><b>${d.getDate()}</b><small>${MON[d.getMonth()]}</small></button>`; }).join("")}</div>
    <div class="times">${day.times.map(t => `<button onclick="pickSlot('${t.ts}','${t.t}',this)">${t.t}${t.star ? "<i>⭐</i>" : ""}</button>`).join("")}</div>
    <p class="hint2">⭐ — рядом с другими занятиями преподавателя. Время — по вашему часовому поясу.</p>`);
  const sel = document.querySelector("#book .days .on"); if (sel) sel.scrollIntoView({inline: "center", block: "nearest"});
}

  await act({action: "slot", tid: BK.tid, ts}, btn);

}

  return `<div class="row"><div class="ic">📝</div><div class="n">${esc(h.text || "Задание")}<small>${esc(h.at.split("-").reverse().join("."))}${h.deadline ? " · до " + esc(h.deadline) : ""}${h.grade ? " · оценка " + esc(h.grade) : ""}</small>${h.comment ? `<small>💬 ${esc(h.comment)}</small>` : ""}</div><span class="tag ${c}">${t}</span></div>`; }
const ORDER = ["home", "hw", "prog", "lib"];
function show(k) { if (k === PAGE) return; const dir = ORDER.indexOf(k) > ORDER.indexOf(PAGE) ? 1 : -1; PAGE = k; haptic();

(function () { let x0 = null, y0 = 0;
